input_text:
  climate_manual_override_context:
    name: Climate Manual Override — Last Automation Context
    max: 255

timer:
  climate_manual_override_timer:
    name: Climate Manual Override — Last Detected Manual Change
    duration: "00:30:00"
    restore: true


input_number:
  climate_forecast_high_today:
    name: Captured Forecast High (Today)
    min: -30
    max: 50
    step: 0.1
    unit_of_measurement: "°C"

  climate_forecast_low_today:
    name: Captured Forecast Low (Today)
    min: -40
    max: 40
    step: 0.1
    unit_of_measurement: "°C"

  climate_forward_outdoor_mean:
    name: Forecast Outdoor Mean (Next Hours)
    min: -40
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
