blueprint:
  name: Adaptive Climate Setpoint (Forecast + Tibber Price)
  description: >
    Uses today's forecast only to decide whether to heat, cool, or stay off -
    cooling on the day's high, heating on its average - and then lets the
    electricity price slide the target along a Charge / Comfort / Coast axis,
    charging the building with heat or cold while power is cheap and coasting
    while it is dear. Price is judged both against fixed thresholds and,
    optionally, against the average price of the coming hours, while how
    deeply to charge is scaled by how much heating or cooling those hours are
    forecast to need. Shuts off at
    night, on selected weekdays, during the dead band, or when the live outdoor
    temperature makes running pointless, and pauses itself for a configurable
    cooldown after any manual change at the device.
  domain: automation
  source_url: https://github.com/Irame/HomeAssistantBlueprints/blob/master/blueprints/automation/Irame/adaptive_climate_setpoint.yaml
  input:
    comfort_setpoints:
      name: Comfort Setpoints
      icon: mdi:thermometer
      description: >
        Three temperatures per mode. The electricity price slides the target
        along the axis between them: comfort at a neutral price, charge when
        power is cheap, coast when it is expensive. The forecast only decides
        whether today heats, cools, or stays off - it no longer moves the
        setpoint.
      collapsed: false
      input:
        cool_comfort:
          name: Cooling - Comfort
          description: >
            What you actually want on a cooling day at a neutral electricity
            price. The target sits exactly here when price influence is 0.
          default: 24
          selector:
            number:
              min: 15
              max: 32
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        cool_charge:
          name: Cooling - Charge
          description: >
            Coldest you will accept while banking cheap electricity into the
            building. Must be at or below Cooling Comfort; set it equal to
            Cooling Comfort to disable cooling-side thermal storage.
          default: 21
          selector:
            number:
              min: 15
              max: 32
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        cool_coast:
          name: Cooling - Coast
          description: >
            Warmest you will tolerate while riding out expensive hours. Must be
            at or above Cooling Comfort; set it equal to Cooling Comfort to
            never give up comfort for price.
          default: 26.5
          selector:
            number:
              min: 15
              max: 32
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        heat_comfort:
          name: Heating - Comfort
          description: >
            What you actually want on a heating day at a neutral electricity
            price.
          default: 21
          selector:
            number:
              min: 12
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        heat_charge:
          name: Heating - Charge
          description: >
            Warmest you will accept while banking cheap electricity into the
            building. Must be at or above Heating Comfort; set it equal to
            Heating Comfort to disable heating-side thermal storage.
          default: 23.5
          selector:
            number:
              min: 12
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        heat_coast:
          name: Heating - Coast
          description: >
            Coolest you will tolerate while riding out expensive hours. Must be
            at or below Heating Comfort; set it equal to Heating Comfort to
            never give up comfort for price.
          default: 19
          selector:
            number:
              min: 12
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    schedule:
      name: Schedule
      icon: mdi:calendar-clock
      description: When the system is allowed to run at all.
      collapsed: false
      input:
        night_start:
          name: Night Mode Start
          default: "22:00:00"
          selector:
            time: {}

        night_end:
          name: Night Mode End
          default: "06:00:00"
          selector:
            time: {}

        disabled_weekdays:
          name: Disabled Weekdays
          description: >
            Optional. On these days the climate device is forced off for the
            entire day, the same way night mode works - it just always
            evaluates as "should be off" regardless of the forecast. Leave
            empty to run every day.
          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Monday
                  value: "0"
                - label: Tuesday
                  value: "1"
                - label: Wednesday
                  value: "2"
                - label: Thursday
                  value: "3"
                - label: Friday
                  value: "4"
                - label: Saturday
                  value: "5"
                - label: Sunday
                  value: "6"

        presence_entities:
          name: Presence Tracking
          description: >
            Optional. person or device_tracker entities to watch. If at
            least one is selected and none of them are "home", the climate
            device is forced off. Leave empty to ignore presence entirely.
          default: []
          selector:
            entity:
              domain:
                - person
                - device_tracker
              multiple: true

    price:
      name: Electricity Price
      icon: mdi:currency-eur
      description: >
        How far the price is allowed to slide the target along the comfort
        axis.
      collapsed: false
      input:
        price_weight:
          name: Electricity Price Influence
          description: >
            How much of the Charge..Coast range the price may actually use.
            1 = the target can reach both anchors, 0.5 = it only ever travels
            halfway, 0 = the target sits on Comfort and price is ignored.
            Leave this at 1 and express what you will tolerate through the
            Charge and Coast temperatures instead.
          default: 1.0
          selector:
            number:
              min: 0
              max: 1
              step: 0.1
              mode: slider

        price_forecast_sensor:
          name: Forward Average Price Sensor
          description: >
            Optional. A sensor whose state is the average price over the coming
            hours - with the tibber_prices HACS integration that is one of the
            "Price Next Nh" sensors, and around 6h is a reasonable match for how
            long a building holds a charge. When set, the automation also asks
            whether now is cheap *relative to what is coming*, which is what
            actually makes storing energy pay. Leave empty to judge price on the
            fixed thresholds alone.
          default: []
          selector:
            entity:
              domain: sensor
              multiple: true

        price_lookahead_margin:
          name: Forward Price Margin
          description: >
            How far the current price must sit below the forward average before
            it counts as fully worth charging, as a fraction of that average.
            0.15 means 15 % cheaper than the coming hours earns a full charge
            signal, and 15 % dearer a full coast signal. Larger values make the
            automation fussier about when it stores energy.
          default: 0.15
          selector:
            number:
              min: 0.02
              max: 1
              step: 0.01
              mode: slider

        price_cheap:
          name: Cheap Price Threshold
          description: >
            At or below this price, electricity counts as fully cheap. Use the
            same unit your price sensor reports (e.g. EUR/kWh). Only used when
            Price Reference is set to "Fixed thresholds".
          default: 0.20
          selector:
            number:
              min: 0
              max: 5
              step: 0.01
              mode: box

        price_expensive:
          name: Expensive Price Threshold
          description: >
            At or above this price, electricity counts as fully expensive. Use
            the same unit your price sensor reports (e.g. EUR/kWh). Only used
            when Price Reference is set to "Fixed thresholds".
          default: 0.35
          selector:
            number:
              min: 0
              max: 5
              step: 0.01
              mode: box

    thermal_storage:
      name: Thermal Storage
      icon: mdi:battery-charging
      description: >
        Charging the building itself with heat or cold while electricity is
        cheap, so less has to be bought while it is expensive. How far the
        target may overshoot is set by the Charge temperatures under Comfort
        Setpoints.
      collapsed: false
      input:
        storage_overrides_schedule:
          name: Charge Outside Normal Hours
          description: >
            While the price is at or below the cheap threshold, ignore night
            mode and the live outdoor temperature override so the building can
            actually be charged during the cheapest hours - which are often at
            night. Open windows, disabled weekdays and absence still force the
            device off. Leave off if running at night would be too noisy.
          default: false
          selector:
            boolean: {}

    advanced_tuning:
      name: Advanced Tuning
      icon: mdi:tune
      description: >
        Reference points and timing guards. Defaults are sensible for most
        setups. Adjust only if you know what you're changing.
      collapsed: true
      input:
        cool_day_threshold:
          name: Cooling Day Threshold
          description: >
            Forecasted high above which today counts as a cooling day. This is
            an outdoor temperature, kept separate from the indoor Cooling
            Comfort setpoint so the two can be tuned independently. Must be
            above the Heating Day Threshold - the gap between them is the dead
            band where the device stays off all day.
          default: 24
          selector:
            number:
              min: 10
              max: 35
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        heating_reference:
          name: Heating Day Reference
          description: >
            Which part of today's forecast the heating decision reads. Heating
            load tracks the whole day rather than its warmest moment, so the
            average of the forecast high and low - the usual heating-degree-day
            measure - is the sensible choice. Heating Day Threshold is
            interpreted in terms of whatever you pick here, so switching this
            means re-tuning it. Cooling is always classified on the forecast
            high and is checked first, so this never affects summer. "Average"
            and "Low" need the Forecast Low Storage Helper; without it they
            fall back to the forecast high.
          default: average
          selector:
            select:
              mode: list
              options:
                - label: Average of forecast high and low
                  value: average
                - label: Forecast low
                  value: low
                - label: Forecast high
                  value: high

        demand_lookahead_hours:
          name: Demand Lookahead
          description: >
            How many hours of the hourly forecast are averaged to judge how
            much heating or cooling is coming. Best kept close to the window of
            your Forward Average Price Sensor, and to how long the building
            actually holds a charge.
          default: 6
          selector:
            number:
              min: 1
              max: 24
              step: 1
              unit_of_measurement: hours
              mode: slider

        demand_cold_ref:
          name: Full Heating Demand Below
          description: >
            Mean forecast outdoor temperature over the lookahead window at
            which the coming heating demand counts as maximal, earning a full
            charge. Demand fades to nothing as that mean approaches your
            Heating Comfort temperature, where the building loses no heat and
            there is nothing worth storing.
          default: 0
          selector:
            number:
              min: -25
              max: 20
              step: 1
              unit_of_measurement: "°C"
              mode: box

        demand_hot_ref:
          name: Full Cooling Demand Above
          description: >
            Mean forecast outdoor temperature over the lookahead window at
            which the coming cooling demand counts as maximal.
          default: 32
          selector:
            number:
              min: 20
              max: 45
              step: 1
              unit_of_measurement: "°C"
              mode: box

        heat_day_threshold:
          name: Heating Day Threshold
          description: >
            Heating reference temperature below which today counts as a heating
            day. This is an outdoor temperature, kept separate from the indoor
            Heating Comfort setpoint. The default suits the "average"
            reference; with "Forecast high" it needs to be several degrees
            higher.
          default: 16
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        forecast_capture_time:
          name: Forecast Capture Time
          description: >
            Time of day to read and freeze today's forecast high and low. Pick
            an early time, before today's peak temperature typically occurs.
          default: "05:00:00"
          selector:
            time: {}

        manual_override_duration_minutes:
          name: Manual Override Cooldown (minutes)
          description: >
            How long the automation pauses itself after detecting a manual
            change to hvac_mode or target temperature at the device. Set to 0
            to disable this guard entirely.
          default: 60
          selector:
            number:
              min: 0
              max: 720
              step: 5
              unit_of_measurement: minutes
              mode: box

        indoor_deadband:
          name: Indoor Deadband
          description: >
            How far past the target the rooms must go before the device is
            held off, and how far back they must drift before it runs again.
            Only used when Indoor Temperature Sensors are set. Tight values
            cycle the compressor, which an inverter unit dislikes and which
            costs more than letting it modulate - 1 K or more is usually
            kinder than precise control.
          default: 1.0
          selector:
            number:
              min: 0.2
              max: 5
              step: 0.1
              unit_of_measurement: "K"
              mode: box

        min_running_minutes:
          name: Minimum Running Time (minutes)
          description: >
            Once switched to heat or cool, won't switch back to off for at
            least this long. Set to 0 to disable.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: minutes
              mode: box

        min_idle_minutes:
          name: Minimum Idle Time (minutes)
          description: >
            Once switched off, won't switch back to heat or cool for at least
            this long. Set to 0 to disable.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: minutes
              mode: box

    devices_and_sensors:
      name: Devices & Sensors
      icon: mdi:devices
      description: The entities this automation reads from and controls.
      collapsed: true
      input:
        climate_entities:
          name: Climate Entities
          description: The climate devices this automation should control.
          selector:
            entity:
              domain: climate
              multiple: true

        weather_entity:
          name: Weather Entity
          description: Used to read today's forecasted high temperature.
          selector:
            entity:
              domain: weather

        price_sensor:
          name: Electricity Price Sensor
          description: >
            Your Tibber (or similar) current-price sensor. Its state must be
            the current price as a plain number, in the same unit as the cheap
            and expensive thresholds.
          selector:
            entity:
              domain: sensor

        indoor_sensors:
          name: Indoor Temperature Sensors
          description: >
            Optional. Sensors that actually represent the rooms this instance
            serves - one hallway sensor covering several rooms works well, and
            more can be added at any time. Their mean is compared against the
            current target, and the device is held off while the rooms are
            already past it, which a unit's own thermostat often cannot judge
            because it sits in its own airflow. Unavailable sensors are simply
            skipped. Leave empty to let each device's thermostat decide alone.
          default: []
          selector:
            entity:
              domain: sensor
              device_class: temperature
              multiple: true

        outdoor_sensor:
          name: Outdoor Temperature Sensor
          description: Live outdoor temperature used for the real-time override.
          selector:
            entity:
              domain: sensor
              device_class: temperature

        door_window_sensors:
          name: Door/Window Sensors
          description: >
            Optional. If any of these is open, the climate device is forced off
            immediately, bypassing the manual override cooldown. Select
            binary_sensor entities (device class door or window). Leave empty
            if you don't have any.
          default: []
          selector:
            entity:
              domain: binary_sensor
              multiple: true

    helpers:
      name: Helper Entities
      icon: mdi:tools
      description: >
        input_number / input_text / input_datetime helpers this automation
        needs for its own bookkeeping. Create one of each in
        Settings, Devices & services, Helpers, then select them here.
      collapsed: true
      input:
        forecast_high_helper:
          name: Forecast High Storage Helper
          description: >
            An input_number helper used to store today's forecasted high once
            per day, so later-day logic isn't affected by forecasts drifting
            downward as the day progresses.
          selector:
            entity:
              domain: input_number

        forecast_low_helper:
          name: Forecast Low Storage Helper
          description: >
            A second input_number helper holding today's forecast low, captured
            at the same time as the high. Required for the "average" and "low"
            heating references - without it the heating decision silently falls
            back to the forecast high. Do not share this helper between
            multiple instances of this blueprint.
          default: []
          selector:
            entity:
              domain: input_number
              multiple: true

        forward_outdoor_helper:
          name: Forward Outdoor Mean Storage Helper
          description: >
            Optional. An input_number holding the mean outdoor temperature of
            the coming hours, refreshed every 15 minutes from the hourly
            forecast. This is what lets the automation charge harder when a
            cold or hot spell is approaching and skip charging when the hours
            ahead need little energy. Without it the charge depth is not scaled
            by demand. Do not share this helper between multiple instances.
          default: []
          selector:
            entity:
              domain: input_number
              multiple: true

        manual_override_context_helper:
          name: Manual Override - Context Tracking Helper
          description: >
            An input_text helper (max length 255) used internally to remember
            this automation's own last context ID, so it can tell its own
            temperature/mode changes apart from a manual change at the device.
            Do not share this helper between multiple instances of this
            blueprint.
          selector:
            entity:
              domain: input_text

        manual_override_timestamp_helper:
          name: Manual Override - Last Manual Change Helper
          description: >
            An input_datetime helper (date + time) used to store when a manual
            change was last detected. Do not share this helper between
            multiple instances of this blueprint.
          selector:
            entity:
              domain: input_datetime

mode: queued
max: 10
trigger:
  - id: refresh
    platform: time_pattern
    minutes: "/1"
  - id: refresh
    platform: state
    entity_id: !input door_window_sensors
  - id: refresh
    platform: state
    entity_id: !input presence_entities
    to: null # ignore attribute changes
  - id: capture_forecast
    platform: time
    at: !input forecast_capture_time
  - id: capture_forecast_if_stale
    platform: homeassistant
    event: start
  # The hourly forecast moves slowly, so this is deliberately far coarser
  # than the refresh loop - it is a service call, not a template.
  - id: capture_demand
    platform: time_pattern
    minutes: "/15"
  - id: capture_demand
    platform: homeassistant
    event: start
  - id: climate_changed
    platform: state
    entity_id: !input climate_entities
    to: null # ignore attribute changes
  - id: climate_changed
    platform: state
    entity_id: !input climate_entities
    attribute: temperature

trace:
  stored_traces: 20

condition: []

action:
  - choose:
      - conditions: "{{ trigger.id == 'capture_demand' }}"
        sequence:
          - variables:
              demand_helper_list: !input forward_outdoor_helper
          - condition: "{{ demand_helper_list | count > 0 }}"
          - action: weather.get_forecasts
            target:
              entity_id: !input weather_entity
            data:
              type: hourly
            response_variable: hourly_result
          - variables:
              demand_weather_id: !input weather_entity
              demand_lookahead_hours: !input demand_lookahead_hours
              hourly_slots: >
                {{ hourly_result[demand_weather_id]['forecast'][:demand_lookahead_hours | int] }}
              forward_outdoor_mean: >
                {% set ns = namespace(t=[]) %}
                {% for s in hourly_slots %}
                  {% if 'temperature' in s and s.temperature is not none %}
                    {% set ns.t = ns.t + [s.temperature | float(0)] %}
                  {% endif %}
                {% endfor %}
                {{ (ns.t | sum / ns.t | count) if ns.t | count > 0 else '' }}
          - condition: "{{ forward_outdoor_mean | is_number }}"
          - action: input_number.set_value
            target:
              entity_id: "{{ demand_helper_list }}"
            data:
              value: "{{ forward_outdoor_mean | float }}"

      - conditions: "{{ trigger.id in ['capture_forecast', 'capture_forecast_if_stale'] }}"
        sequence:
          - variables:
              capture_helper_id: !input forecast_high_helper
              helper_is_stale: >
                {% set s = states[capture_helper_id] %}
                {{ s is none
                   or not (s.state | is_number)
                   or as_local(s.last_changed).date() != now().date() }}
          # On restart, only re-read the forecast if today's high was never
          # captured - otherwise a late-day restart would overwrite the
          # morning peak with whatever is left of the day.
          - condition: "{{ trigger.id == 'capture_forecast' or helper_is_stale }}"
          - action: weather.get_forecasts
            target:
              entity_id: !input weather_entity
            data:
              type: daily
            response_variable: forecast_result
          - variables:
              weather_entity_id: !input weather_entity
              forecast_low_helper_list: !input forecast_low_helper
              today_forecast: "{{ forecast_result[weather_entity_id]['forecast'][0] }}"
          - action: input_number.set_value
            target:
              entity_id: !input forecast_high_helper
            data:
              value: "{{ today_forecast['temperature'] | float }}"
          - if: "{{ forecast_low_helper_list | count > 0 }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: "{{ forecast_low_helper_list }}"
                data:
                  # Not every weather integration reports templow; falling back
                  # to the high makes the average degrade to the old behaviour
                  # instead of poisoning it with a zero.
                  value: >
                    {% set lo = today_forecast.templow if 'templow' in today_forecast else none %}
                    {{ lo | float(today_forecast['temperature'] | float) }}

      - conditions: "{{ trigger.id == 'climate_changed' }}"
        sequence:
          - variables:
              context_helper_id: !input manual_override_context_helper
              context_comp: "{{ context.parent_id }}"
              is_side_effect_temp_change: >
                {{ trigger.to_state.state in ['fan_only', 'dry', 'off']
                    and trigger.attribute == 'temperature' }}
              is_self_caused: >
                {{ context_comp is not none
                    and context_comp == states(context_helper_id) }}
          - choose:
              - conditions: "{{ not is_side_effect_temp_change and not is_self_caused }}"
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: !input manual_override_timestamp_helper
                    data:
                      timestamp: "{{ now().timestamp() }}"

      - conditions: "{{ trigger.id == 'refresh' }}"
        sequence:
          # No weather.get_forecasts here on purpose: the captured high is
          # what this automation is supposed to plan the day around, and
          # polling the forecast once a minute per instance is pure overhead.
          - variables:
              forecast_high_helper_id: !input forecast_high_helper
              price_sensor_id: !input price_sensor
              outdoor_sensor_id: !input outdoor_sensor
              timestamp_helper_id: !input manual_override_timestamp_helper
              override_duration_minutes: !input manual_override_duration_minutes
              climate_entities_list: !input climate_entities
              door_window_entities: !input door_window_sensors
              min_running_minutes: !input min_running_minutes
              min_idle_minutes: !input min_idle_minutes

              cool_comfort: !input cool_comfort
              cool_charge: !input cool_charge
              cool_coast: !input cool_coast
              heat_comfort: !input heat_comfort
              heat_charge: !input heat_charge
              heat_coast: !input heat_coast
              cool_day_threshold: !input cool_day_threshold
              heat_day_threshold: !input heat_day_threshold
              price_weight: !input price_weight

              disabled_weekdays_list: !input disabled_weekdays
              is_disabled_day: "{{ now().weekday() | string in disabled_weekdays_list }}"

              presence_entities: !input presence_entities
              everyone_away: >
                {{ presence_entities | length > 0
                   and (expand(presence_entities) | selectattr('state', 'eq', 'home') | list | count) == 0 }}

              manual_override_active: >
                {{ (as_timestamp(now()) - as_timestamp(states(timestamp_helper_id), 0))
                   < (override_duration_minutes * 60) }}

              forecast_valid: "{{ states(forecast_high_helper_id) | is_number }}"
              outdoor_valid: "{{ states(outdoor_sensor_id) | is_number }}"
              price_valid: "{{ states(price_sensor_id) | is_number }}"

              max_temp_today: "{{ states(forecast_high_helper_id) | float(0) }}"
              current_outdoor_temp: "{{ states(outdoor_sensor_id) | float(0) }}"

              forecast_low_helper_list: !input forecast_low_helper
              low_valid: >
                {{ forecast_low_helper_list | count > 0
                   and states(forecast_low_helper_list[0]) | is_number }}
              min_temp_today: >
                {{ states(forecast_low_helper_list[0]) | float(max_temp_today)
                   if low_valid else max_temp_today }}

              # Cooling is classified on the forecast high; heating gets its own
              # reference because heating load follows the whole day, not its
              # warmest moment.
              heating_reference: !input heating_reference
              heating_reference_degraded: "{{ heating_reference != 'high' and not low_valid }}"
              heat_reference_temp: >
                {% if not low_valid or heating_reference == 'high' %}
                  {{ max_temp_today }}
                {% elif heating_reference == 'low' %}
                  {{ min_temp_today }}
                {% else %}
                  {{ (max_temp_today + min_temp_today) / 2 }}
                {% endif %}

              price_cheap: !input price_cheap
              price_expensive: !input price_expensive

              current_price: "{{ states(price_sensor_id) | float(0) }}"

              day_type: >
                {% if max_temp_today > cool_day_threshold %}
                  cool
                {% elif (heat_reference_temp | float) < heat_day_threshold %}
                  heat
                {% else %}
                  off
                {% endif %}

              price_factor: >
                {% set lo = price_cheap | float(0) %}
                {% set hi = price_expensive | float(0) %}
                {% if not price_valid %}
                  1
                {% else %}
                  {{ ((current_price - lo) / (hi - lo)) if hi > lo else 0 }}
                {% endif %}
              price_factor_clamped: "{{ [[price_factor | float, 0] | max, 1] | min }}"

              # One signed price signal drives everything:
              #   -1 = charge (cheap)   0 = comfort   +1 = coast (expensive)
              # The absolute half asks "is this cheap in euros", the forward
              # half asks "is this cheap compared with the hours ahead". Storing
              # energy only pays when both agree, so they are averaged.
              price_signal_absolute: "{{ (2 * (price_factor_clamped | float)) - 1 }}"

              price_forecast_list: !input price_forecast_sensor
              price_lookahead_margin: !input price_lookahead_margin
              forward_mean_price: >
                {{ states(price_forecast_list[0]) | float(0)
                   if price_forecast_list | count > 0 else 0 }}
              lookahead_valid: >
                {{ price_valid
                   and price_forecast_list | count > 0
                   and states(price_forecast_list[0]) | is_number
                   and (forward_mean_price | float) > 0 }}
              price_signal_forward: >
                {% if lookahead_valid %}
                  {% set fm = forward_mean_price | float %}
                  {% set span = (price_lookahead_margin | float) * fm %}
                  {{ [[(current_price - fm) / span, -1] | max, 1] | min if span > 0 else 0 }}
                {% else %}
                  0
                {% endif %}

              price_signal_raw: >
                {% if lookahead_valid %}
                  {{ ((price_signal_absolute | float) + (price_signal_forward | float)) / 2 }}
                {% else %}
                  {{ price_signal_absolute | float }}
                {% endif %}
              price_signal: >
                {{ [[(price_signal_raw | float) * (price_weight | float), -1] | max, 1] | min }}

              # Anchors for whichever mode today is running.
              anchor_comfort: "{{ cool_comfort if day_type == 'cool' else heat_comfort }}"
              anchor_charge: "{{ cool_charge if day_type == 'cool' else heat_charge }}"
              anchor_coast: "{{ cool_coast if day_type == 'cool' else heat_coast }}"

              # How much heating or cooling the coming hours will actually
              # need. A cheap hour is only worth charging into if there is
              # demand ahead to spend it on, and a cold snap under expensive
              # power is worth charging harder for.
              forward_outdoor_list: !input forward_outdoor_helper
              demand_valid: >
                {{ forward_outdoor_list | count > 0
                   and states(forward_outdoor_list[0]) | is_number }}
              forward_outdoor_mean: >
                {{ states(forward_outdoor_list[0]) | float(0) if demand_valid else 0 }}
              demand_cold_ref: !input demand_cold_ref
              demand_hot_ref: !input demand_hot_ref
              demand_factor: >
                {% if not demand_valid %}
                  1
                {% elif day_type == 'cool' %}
                  {% set span = (demand_hot_ref | float) - (cool_comfort | float) %}
                  {% set raw = ((forward_outdoor_mean | float) - (cool_comfort | float)) / span if span > 0 else 1 %}
                  {{ [[raw, 0] | max, 1] | min }}
                {% elif day_type == 'heat' %}
                  {% set span = (heat_comfort | float) - (demand_cold_ref | float) %}
                  {% set raw = ((heat_comfort | float) - (forward_outdoor_mean | float)) / span if span > 0 else 1 %}
                  {{ [[raw, 0] | max, 1] | min }}
                {% else %}
                  0
                {% endif %}

              # Demand only ever pulls the charge anchor back toward comfort;
              # it never pushes past what you said you would tolerate.
              effective_charge: >
                {{ (anchor_comfort | float)
                   + ((anchor_charge | float) - (anchor_comfort | float))
                     * (demand_factor | float) }}

              # Slide along the axis. The same expression works for both modes:
              # cooling has charge < comfort < coast, heating has it reversed,
              # and the sign of the signal picks the correct side either way.
              target_temp_raw: >
                {% set p = price_signal | float %}
                {% set c = anchor_comfort | float %}
                {% if p > 0 %}
                  {{ c + p * ((anchor_coast | float) - c) }}
                {% else %}
                  {{ c + p * (c - (effective_charge | float)) }}
                {% endif %}
              # Kept at 0.5 here; the per-device step is applied later, once
              # the entity that will receive the value is known.
              target_temp: "{{ ((target_temp_raw | float * 2) | round(0) / 2) }}"

              night_start_str: !input night_start
              night_end_str: !input night_end
              night_start_t: "{{ strptime(night_start_str, '%H:%M:%S').time() }}"
              night_end_t: "{{ strptime(night_end_str, '%H:%M:%S').time() }}"
              now_t: "{{ now().time() }}"
              is_night: >
                {% if night_start_t <= night_end_t %}
                  {{ night_start_t <= now_t < night_end_t }}
                {% else %}
                  {{ now_t >= night_start_t or now_t < night_end_t }}
                {% endif %}

              # Compared against the indoor setpoints, not the day thresholds:
              # this asks "is running pointless right now", which is a question
              # about the room's target, not about how the day was classified.
              outdoor_override_off: >
                {% if not outdoor_valid %}
                  false
                {% elif day_type == 'cool' %}
                  {{ current_outdoor_temp <= (cool_comfort | float) }}
                {% elif day_type == 'heat' %}
                  {{ current_outdoor_temp >= (heat_comfort | float) }}
                {% else %}
                  false
                {% endif %}

              window_open: >
                {{ door_window_entities | length > 0
                   and (expand(door_window_entities) | selectattr('state', 'eq', 'on') | list | count) > 0 }}

              storage_overrides_schedule: !input storage_overrides_schedule
              # Deliberately the absolute measure, not the combined signal: the
              # night bypass should need power to be genuinely cheap, not merely
              # cheaper than the hours that follow.
              price_is_cheap: "{{ (price_factor_clamped | float) <= 0 }}"
              storage_charging: >
                {{ (price_weight | float) > 0
                   and price_is_cheap
                   and (price_signal | float) < 0
                   and day_type != 'off'
                   and (effective_charge | float) != (anchor_comfort | float) }}
              storage_bypass: "{{ storage_overrides_schedule and storage_charging }}"

              # Measured room temperature, against the target actually in force
              # - so while charging this asks whether the charge has landed,
              # not whether the room is merely comfortable.
              indoor_sensor_list: !input indoor_sensors
              indoor_deadband: !input indoor_deadband
              indoor_readings: >
                {% set ns = namespace(t=[]) %}
                {% for e in indoor_sensor_list %}
                  {% if states(e) | is_number %}
                    {% set ns.t = ns.t + [states(e) | float] %}
                  {% endif %}
                {% endfor %}
                {{ ns.t }}
              indoor_valid: "{{ indoor_readings | count > 0 }}"
              indoor_temp: >
                {{ (indoor_readings | sum / indoor_readings | count)
                   if indoor_valid else 0 }}
              # Real hysteresis rather than one threshold: the device runs
              # until the room is a deadband past the target, then stays off
              # until the room has drifted all the way back to it.
              indoor_satisfied: >
                {% if not indoor_valid %}
                  false
                {% else %}
                  {% set t = target_temp | float %}
                  {% set i = indoor_temp | float %}
                  {% set db = indoor_deadband | float %}
                  {% set idle = is_state(climate_entities_list[0], 'off') %}
                  {% if day_type == 'cool' %}
                    {{ (i < t) if idle else (i <= t - db) }}
                  {% elif day_type == 'heat' %}
                    {{ (i > t) if idle else (i >= t + db) }}
                  {% else %}
                    false
                  {% endif %}
                {% endif %}

              # indoor_satisfied is never bypassed by storage: if the rooms have
              # already reached the charge target, the charge is in the building
              # and running on would only overshoot it.
              should_be_off: >
                {{ window_open or is_disabled_day or everyone_away or day_type == 'off'
                   or indoor_satisfied
                   or ((is_night or outdoor_override_off) and not storage_bypass) }}

              first_climate_entity: "{{ climate_entities_list[0] }}"
              current_mode: "{{ states(first_climate_entity) }}"
              is_currently_off: "{{ current_mode == 'off' }}"
              seconds_in_current_state: >
                {% if states[first_climate_entity] is not none %}
                  {{ as_timestamp(now()) - as_timestamp(states[first_climate_entity].last_changed) }}
                {% else %}
                  0
                {% endif %}

              min_run_elapsed: "{{ seconds_in_current_state >= (min_running_minutes | float * 60) }}"
              min_idle_elapsed: "{{ seconds_in_current_state >= (min_idle_minutes | float * 60) }}"

              timing_guard_ok: >
                {% if should_be_off %}
                  {{ is_currently_off or min_run_elapsed }}
                {% else %}
                  {{ (not is_currently_off) or min_idle_elapsed }}
                {% endif %}

              desired_mode: "{{ 'off' if should_be_off else day_type }}"

              # The setpoint each device should actually receive: snapped to
              # that device's own step and clamped to its own range, so a
              # storage boost can never ask for a value it would reject.
              entity_targets: >
                {% set ns = namespace(d={}) %}
                {% for e in climate_entities_list %}
                  {% set lo = state_attr(e, 'min_temp') | float(7) %}
                  {% set hi = state_attr(e, 'max_temp') | float(35) %}
                  {% set raw_step = state_attr(e, 'target_temp_step') | float(0.5) %}
                  {% set step = raw_step if raw_step > 0 else 0.5 %}
                  {% set snapped = (((target_temp | float) / step) | round(0)) * step %}
                  {% set ns.d = dict(ns.d, **{e: [[snapped, lo] | max, hi] | min}) %}
                {% endfor %}
                {{ ns.d }}

              # Only touch the devices when the command would actually change
              # something. Re-sending the same mode and setpoint every minute
              # spams the devices and fills the recorder for nothing.
              needs_change: >
                {% set ns = namespace(v=false) %}
                {% for e in climate_entities_list %}
                  {% if not is_state(e, desired_mode) %}
                    {% set ns.v = true %}
                  {% elif desired_mode != 'off'
                          and (state_attr(e, 'temperature') | float(-999)
                               - entity_targets[e]) | abs > 0.05 %}
                    {% set ns.v = true %}
                  {% endif %}
                {% endfor %}
                {{ ns.v }}

              execute_now: "{{ (window_open or not manual_override_active) and timing_guard_ok }}"

          - if: "{{ not forecast_valid }}"
            then:
              - stop: >
                  Forecast high helper holds no number yet - waiting for the
                  next forecast capture.

          - choose:
              - conditions: "{{ window_open }}"
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: !input manual_override_timestamp_helper
                    data:
                      timestamp: 0

          - if: "{{ execute_now and needs_change }}"
            then:
              - action: input_text.set_value
                target:
                  entity_id: !input manual_override_context_helper
                data:
                  value: "{{ context.id }}"
              - repeat:
                  for_each: "{{ climate_entities_list }}"
                  sequence:
                    - variables:
                        entity: "{{ repeat.item }}"
                        entity_target: "{{ entity_targets[repeat.item] }}"
                    - if: "{{ not is_state(entity, desired_mode) }}"
                      then:
                        - action: climate.set_hvac_mode
                          target:
                            entity_id: "{{ entity }}"
                          data:
                            hvac_mode: "{{ desired_mode }}"
                    - if: >
                        {{ desired_mode != 'off'
                           and (state_attr(entity, 'temperature') | float(-999)
                                - (entity_target | float)) | abs > 0.05 }}
                      then:
                        - action: climate.set_temperature
                          target:
                            entity_id: "{{ entity }}"
                          data:
                            temperature: "{{ entity_target | float }}"
