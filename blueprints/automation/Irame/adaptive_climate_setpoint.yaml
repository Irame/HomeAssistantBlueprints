blueprint:
  name: Adaptive Climate Setpoint (Forecast + Tibber Price)
  description: >
    Chooses heating, cooling, or off based on today's forecasted high relative
    to separate cooling/heating baselines, scales the target temperature by
    severity and electricity price, shuts off at night, on selected weekdays,
    during the dead band, or when the live outdoor temperature makes running
    pointless, and pauses itself for a configurable cooldown after any manual
    change at the device.
  domain: automation
  source_url: https://github.com/Irame/HomeAssistantBlueprints/blob/master/blueprints/automation/Irame/adaptive_climate_setpoint.yaml
  input:
    comfort_setpoints:
      name: Comfort Setpoints
      icon: mdi:thermometer
      description: The temperature targets and baselines this automation scales between.
      collapsed: false
      input:
        cool_setpoint_min:
          name: Cooling Setpoint Min
          description: Most aggressive cooling target (coldest allowed) on the hottest days.
          default: 21
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        cool_setpoint_baseline:
          name: Cooling Setpoint Baseline
          description: Where cooling starts from (severity 0) once a day is classified as a cooling day.
          default: 24
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        heat_setpoint_baseline:
          name: Heating Setpoint Baseline
          description: Where heating starts from (severity 0) once a day is classified as a heating day.
          default: 21
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        heat_setpoint_max:
          name: Heating Setpoint Max
          description: Most aggressive heating target (warmest allowed) on the coldest days.
          default: 26
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    schedule:
      name: Schedule
      icon: mdi:calendar-clock
      description: When the system is allowed to run at all.
      collapsed: false
      input:
        night_start:
          name: Night Mode Start
          default: "22:00:00"
          selector:
            time: {}

        night_end:
          name: Night Mode End
          default: "06:00:00"
          selector:
            time: {}

        disabled_weekdays:
          name: Disabled Weekdays
          description: >
            Optional. On these days the climate device is forced off for the
            entire day, the same way night mode works - it just always
            evaluates as "should be off" regardless of the forecast. Leave
            empty to run every day.
          default: []
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Monday
                  value: "0"
                - label: Tuesday
                  value: "1"
                - label: Wednesday
                  value: "2"
                - label: Thursday
                  value: "3"
                - label: Friday
                  value: "4"
                - label: Saturday
                  value: "5"
                - label: Sunday
                  value: "6"

        presence_entities:
          name: Presence Tracking
          description: >
            Optional. person or device_tracker entities to watch. If at
            least one is selected and none of them are "home", the climate
            device is forced off. Leave empty to ignore presence entirely.
          default: []
          selector:
            entity:
              domain:
                - person
                - device_tracker
              multiple: true

    price:
      name: Electricity Price
      icon: mdi:currency-eur
      description: How much today's live price should temper the target temperature.
      collapsed: false
      input:
        price_weight:
          name: Electricity Price Influence
          description: 0 = ignore price entirely, 1 = full influence.
          default: 0.5
          selector:
            number:
              min: 0
              max: 1
              step: 0.1
              mode: slider

        price_reference_mode:
          name: Price Reference
          description: >
            How "cheap" and "expensive" are determined. "Fixed thresholds"
            uses the two absolute prices below, so a day that is expensive
            from morning to night stays expensive. "Today's min/max" scales
            against the cheapest and most expensive hour of the current day,
            which always reports some hour as cheap even when every hour is
            costly.
          default: fixed
          selector:
            select:
              mode: list
              options:
                - label: Fixed thresholds
                  value: fixed
                - label: Today's min/max (price sensor attributes)
                  value: daily

        price_cheap:
          name: Cheap Price Threshold
          description: >
            At or below this price, electricity counts as fully cheap. Use the
            same unit your price sensor reports (e.g. EUR/kWh). Only used when
            Price Reference is set to "Fixed thresholds".
          default: 0.20
          selector:
            number:
              min: 0
              max: 5
              step: 0.01
              mode: box

        price_expensive:
          name: Expensive Price Threshold
          description: >
            At or above this price, electricity counts as fully expensive. Use
            the same unit your price sensor reports (e.g. EUR/kWh). Only used
            when Price Reference is set to "Fixed thresholds".
          default: 0.35
          selector:
            number:
              min: 0
              max: 5
              step: 0.01
              mode: box

    thermal_storage:
      name: Thermal Storage
      icon: mdi:battery-charging
      description: >
        Charging the building itself with heat or cold while electricity is
        cheap, so less has to be bought while it is expensive.
      collapsed: false
      input:
        storage_boost_degrees:
          name: Storage Boost
          description: >
            How far past the most aggressive setpoint the target may be pushed
            while electricity is at its cheapest - cooling below Cooling
            Setpoint Min, heating above Heating Setpoint Max. The boost fades
            in linearly as the price drops from the expensive threshold to the
            cheap one, and is scaled by Electricity Price Influence. Set to 0
            to disable thermal storage.
          default: 1.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        storage_overrides_schedule:
          name: Charge Outside Normal Hours
          description: >
            While the price is at or below the cheap threshold, ignore night
            mode and the live outdoor temperature override so the building can
            actually be charged during the cheapest hours - which are often at
            night. Open windows, disabled weekdays and absence still force the
            device off. Leave off if running at night would be too noisy.
          default: false
          selector:
            boolean: {}

    advanced_tuning:
      name: Advanced Tuning
      icon: mdi:tune
      description: >
        Reference points and timing guards. Defaults are sensible for most
        setups. Adjust only if you know what you're changing.
      collapsed: true
      input:
        cool_day_threshold:
          name: Cooling Day Threshold
          description: >
            Forecasted high above which today counts as a cooling day. This is
            an outdoor temperature, kept separate from the indoor Cooling
            Setpoint Baseline so the two can be tuned independently. Must be
            above the Heating Day Threshold - the gap between them is the dead
            band where the device stays off all day.
          default: 24
          selector:
            number:
              min: 10
              max: 35
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        heat_day_threshold:
          name: Heating Day Threshold
          description: >
            Forecasted high below which today counts as a heating day. This is
            an outdoor temperature, kept separate from the indoor Heating
            Setpoint Baseline.
          default: 21
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        outdoor_hot_ref:
          name: Hot Day Reference
          description: Forecasted high at which cooling severity reaches maximum (1.0).
          default: 30
          selector:
            number:
              min: 20
              max: 45
              step: 1
              unit_of_measurement: "°C"
              mode: box

        outdoor_cold_ref:
          name: Cold Day Reference
          description: Forecasted high at which heating severity reaches maximum (1.0).
          default: 5
          selector:
            number:
              min: -20
              max: 15
              step: 1
              unit_of_measurement: "°C"
              mode: box

        forecast_capture_time:
          name: Forecast Capture Time
          description: >
            Time of day to read and freeze the forecasted high. Pick an early
            time, before today's peak temperature typically occurs.
          default: "05:00:00"
          selector:
            time: {}

        manual_override_duration_minutes:
          name: Manual Override Cooldown (minutes)
          description: >
            How long the automation pauses itself after detecting a manual
            change to hvac_mode or target temperature at the device. Set to 0
            to disable this guard entirely.
          default: 60
          selector:
            number:
              min: 0
              max: 720
              step: 5
              unit_of_measurement: minutes
              mode: box

        min_running_minutes:
          name: Minimum Running Time (minutes)
          description: >
            Once switched to heat or cool, won't switch back to off for at
            least this long. Set to 0 to disable.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: minutes
              mode: box

        min_idle_minutes:
          name: Minimum Idle Time (minutes)
          description: >
            Once switched off, won't switch back to heat or cool for at least
            this long. Set to 0 to disable.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: minutes
              mode: box

    devices_and_sensors:
      name: Devices & Sensors
      icon: mdi:devices
      description: The entities this automation reads from and controls.
      collapsed: true
      input:
        climate_entities:
          name: Climate Entities
          description: The climate devices this automation should control.
          selector:
            entity:
              domain: climate
              multiple: true

        weather_entity:
          name: Weather Entity
          description: Used to read today's forecasted high temperature.
          selector:
            entity:
              domain: weather

        price_sensor:
          name: Electricity Price Sensor
          description: >
            Your Tibber (or similar) current-price sensor. Must expose min_price
            and max_price attributes for today.
          selector:
            entity:
              domain: sensor

        outdoor_sensor:
          name: Outdoor Temperature Sensor
          description: Live outdoor temperature used for the real-time override.
          selector:
            entity:
              domain: sensor
              device_class: temperature

        door_window_sensors:
          name: Door/Window Sensors
          description: >
            Optional. If any of these is open, the climate device is forced off
            immediately, bypassing the manual override cooldown. Select
            binary_sensor entities (device class door or window). Leave empty
            if you don't have any.
          default: []
          selector:
            entity:
              domain: binary_sensor
              multiple: true

    helpers:
      name: Helper Entities
      icon: mdi:tools
      description: >
        input_number / input_text / input_datetime helpers this automation
        needs for its own bookkeeping. Create one of each in
        Settings, Devices & services, Helpers, then select them here.
      collapsed: true
      input:
        forecast_high_helper:
          name: Forecast High Storage Helper
          description: >
            An input_number helper used to store today's forecasted high once
            per day, so later-day logic isn't affected by forecasts drifting
            downward as the day progresses.
          selector:
            entity:
              domain: input_number

        manual_override_context_helper:
          name: Manual Override - Context Tracking Helper
          description: >
            An input_text helper (max length 255) used internally to remember
            this automation's own last context ID, so it can tell its own
            temperature/mode changes apart from a manual change at the device.
            Do not share this helper between multiple instances of this
            blueprint.
          selector:
            entity:
              domain: input_text

        manual_override_timestamp_helper:
          name: Manual Override - Last Manual Change Helper
          description: >
            An input_datetime helper (date + time) used to store when a manual
            change was last detected. Do not share this helper between
            multiple instances of this blueprint.
          selector:
            entity:
              domain: input_datetime

mode: queued
max: 10
trigger:
  - id: refresh
    platform: time_pattern
    minutes: "/1"
  - id: refresh
    platform: state
    entity_id: !input door_window_sensors
  - id: refresh
    platform: state
    entity_id: !input presence_entities
    to: null # ignore attribute changes
  - id: capture_forecast
    platform: time
    at: !input forecast_capture_time
  - id: capture_forecast_if_stale
    platform: homeassistant
    event: start
  - id: climate_changed
    platform: state
    entity_id: !input climate_entities
    to: null # ignore attribute changes
  - id: climate_changed
    platform: state
    entity_id: !input climate_entities
    attribute: temperature

trace:
  stored_traces: 20

condition: []

action:
  - choose:
      - conditions: "{{ trigger.id in ['capture_forecast', 'capture_forecast_if_stale'] }}"
        sequence:
          - variables:
              capture_helper_id: !input forecast_high_helper
              helper_is_stale: >
                {% set s = states[capture_helper_id] %}
                {{ s is none
                   or not (s.state | is_number)
                   or as_local(s.last_changed).date() != now().date() }}
          # On restart, only re-read the forecast if today's high was never
          # captured - otherwise a late-day restart would overwrite the
          # morning peak with whatever is left of the day.
          - condition: "{{ trigger.id == 'capture_forecast' or helper_is_stale }}"
          - action: weather.get_forecasts
            target:
              entity_id: !input weather_entity
            data:
              type: daily
            response_variable: forecast_result
          - variables:
              weather_entity_id: !input weather_entity
          - action: input_number.set_value
            target:
              entity_id: !input forecast_high_helper
            data:
              value: "{{ forecast_result[weather_entity_id]['forecast'][0]['temperature'] | float }}"

      - conditions: "{{ trigger.id == 'climate_changed' }}"
        sequence:
          - variables:
              context_helper_id: !input manual_override_context_helper
              context_comp: "{{ context.parent_id }}"
              is_side_effect_temp_change: >
                {{ trigger.to_state.state in ['fan_only', 'dry', 'off']
                    and trigger.attribute == 'temperature' }}
              is_self_caused: >
                {{ context_comp is not none
                    and context_comp == states(context_helper_id) }}
          - choose:
              - conditions: "{{ not is_side_effect_temp_change and not is_self_caused }}"
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: !input manual_override_timestamp_helper
                    data:
                      timestamp: "{{ now().timestamp() }}"

      - conditions: "{{ trigger.id == 'refresh' }}"
        sequence:
          - action: weather.get_forecasts
            target:
              entity_id: !input weather_entity
            data:
              type: daily
            response_variable: forecast_result
          - variables:
              forecast_high_helper_id: !input forecast_high_helper
              weather_entity_id: !input weather_entity
              price_sensor_id: !input price_sensor
              outdoor_sensor_id: !input outdoor_sensor
              timestamp_helper_id: !input manual_override_timestamp_helper
              override_duration_minutes: !input manual_override_duration_minutes
              climate_entities_list: !input climate_entities
              door_window_entities: !input door_window_sensors
              min_running_minutes: !input min_running_minutes
              min_idle_minutes: !input min_idle_minutes

              cool_setpoint_min: !input cool_setpoint_min
              cool_setpoint_baseline: !input cool_setpoint_baseline
              heat_setpoint_baseline: !input heat_setpoint_baseline
              heat_setpoint_max: !input heat_setpoint_max
              cool_day_threshold: !input cool_day_threshold
              heat_day_threshold: !input heat_day_threshold
              outdoor_hot_ref: !input outdoor_hot_ref
              outdoor_cold_ref: !input outdoor_cold_ref
              price_weight: !input price_weight

              disabled_weekdays_list: !input disabled_weekdays
              is_disabled_day: "{{ now().weekday() | string in disabled_weekdays_list }}"

              presence_entities: !input presence_entities
              everyone_away: >
                {{ presence_entities | length > 0
                   and (expand(presence_entities) | selectattr('state', 'eq', 'home') | list | count) == 0 }}

              manual_override_active: >
                {{ (as_timestamp(now()) - as_timestamp(states(timestamp_helper_id), 0))
                   < (override_duration_minutes * 60) }}

              forecast_valid: "{{ states(forecast_high_helper_id) | is_number }}"
              outdoor_valid: "{{ states(outdoor_sensor_id) | is_number }}"
              price_valid: "{{ states(price_sensor_id) | is_number }}"

              max_temp_today: "{{ states(forecast_high_helper_id) | float(0) }}"
              max_temp_today_from_now: "{{ forecast_result[weather_entity_id]['forecast'][0]['temperature'] | float(max_temp_today) }}"
              current_outdoor_temp: "{{ states(outdoor_sensor_id) | float(0) }}"

              price_reference_mode: !input price_reference_mode
              price_cheap: !input price_cheap
              price_expensive: !input price_expensive

              current_price: "{{ states(price_sensor_id) | float(0) }}"
              price_low_ref: >
                {% if price_reference_mode == 'fixed' %}
                  {{ price_cheap }}
                {% else %}
                  {{ state_attr(price_sensor_id, 'min_price') | float(0) }}
                {% endif %}
              price_high_ref: >
                {% if price_reference_mode == 'fixed' %}
                  {{ price_expensive }}
                {% else %}
                  {{ state_attr(price_sensor_id, 'max_price') | float(1) }}
                {% endif %}

              day_type: >
                {% if max_temp_today > cool_day_threshold %}
                  cool
                {% elif max_temp_today < heat_day_threshold %}
                  heat
                {% else %}
                  off
                {% endif %}

              raw_severity: >
                {% if day_type == 'cool' %}
                  {% set span = outdoor_hot_ref - cool_day_threshold %}
                  {{ ((max_temp_today_from_now - cool_day_threshold) / span) if span > 0 else 1 }}
                {% elif day_type == 'heat' %}
                  {% set span = heat_day_threshold - outdoor_cold_ref %}
                  {{ ((heat_day_threshold - max_temp_today_from_now) / span) if span > 0 else 1 }}
                {% else %}
                  0
                {% endif %}
              severity: "{{ [[raw_severity | float, 0] | max, 1] | min }}"

              price_factor: >
                {% set lo = price_low_ref | float(0) %}
                {% set hi = price_high_ref | float(0) %}
                {% if not price_valid %}
                  1
                {% else %}
                  {{ ((current_price - lo) / (hi - lo)) if hi > lo else 0 }}
                {% endif %}
              price_factor_clamped: "{{ [[price_factor | float, 0] | max, 1] | min }}"

              dampening: "{{ 1 - (price_weight * price_factor_clamped) }}"
              effective_severity: "{{ [[(severity * dampening) | float, 0] | max, 1] | min }}"

              storage_boost_degrees: !input storage_boost_degrees
              cheapness: "{{ 1 - (price_factor_clamped | float) }}"
              storage_boost: >
                {{ (price_weight | float) * (storage_boost_degrees | float) * (cheapness | float) }}

              target_temp_raw: >
                {% if day_type == 'cool' %}
                  {{ cool_setpoint_baseline - effective_severity * (cool_setpoint_baseline - cool_setpoint_min) - (storage_boost | float) }}
                {% elif day_type == 'heat' %}
                  {{ heat_setpoint_baseline + effective_severity * (heat_setpoint_max - heat_setpoint_baseline) + (storage_boost | float) }}
                {% else %}
                  {{ cool_setpoint_baseline }}
                {% endif %}
              target_temp: "{{ ((target_temp_raw | float * 2) | round(0) / 2) }}"

              night_start_str: !input night_start
              night_end_str: !input night_end
              night_start_t: "{{ strptime(night_start_str, '%H:%M:%S').time() }}"
              night_end_t: "{{ strptime(night_end_str, '%H:%M:%S').time() }}"
              now_t: "{{ now().time() }}"
              is_night: >
                {% if night_start_t <= night_end_t %}
                  {{ night_start_t <= now_t < night_end_t }}
                {% else %}
                  {{ now_t >= night_start_t or now_t < night_end_t }}
                {% endif %}

              outdoor_override_off: >
                {% if not outdoor_valid %}
                  false
                {% elif day_type == 'cool' %}
                  {{ current_outdoor_temp <= cool_day_threshold }}
                {% elif day_type == 'heat' %}
                  {{ current_outdoor_temp >= heat_day_threshold }}
                {% else %}
                  false
                {% endif %}

              window_open: >
                {{ door_window_entities | length > 0
                   and (expand(door_window_entities) | selectattr('state', 'eq', 'on') | list | count) > 0 }}

              storage_overrides_schedule: !input storage_overrides_schedule
              price_is_cheap: "{{ (price_factor_clamped | float) <= 0 }}"
              storage_charging: >
                {{ (storage_boost_degrees | float) > 0
                   and (price_weight | float) > 0
                   and price_is_cheap
                   and day_type != 'off' }}
              storage_bypass: "{{ storage_overrides_schedule and storage_charging }}"

              should_be_off: >
                {{ window_open or is_disabled_day or everyone_away or day_type == 'off'
                   or ((is_night or outdoor_override_off) and not storage_bypass) }}

              first_climate_entity: "{{ climate_entities_list[0] }}"
              current_mode: "{{ states(first_climate_entity) }}"
              is_currently_off: "{{ current_mode == 'off' }}"
              seconds_in_current_state: >
                {% if states[first_climate_entity] is not none %}
                  {{ as_timestamp(now()) - as_timestamp(states[first_climate_entity].last_changed) }}
                {% else %}
                  0
                {% endif %}

              min_run_elapsed: "{{ seconds_in_current_state >= (min_running_minutes | float * 60) }}"
              min_idle_elapsed: "{{ seconds_in_current_state >= (min_idle_minutes | float * 60) }}"

              timing_guard_ok: >
                {% if should_be_off %}
                  {{ is_currently_off or min_run_elapsed }}
                {% else %}
                  {{ (not is_currently_off) or min_idle_elapsed }}
                {% endif %}

              execute_now: "{{ (window_open or not manual_override_active) and timing_guard_ok }}"

          - if: "{{ not forecast_valid }}"
            then:
              - stop: >
                  Forecast high helper holds no number yet - waiting for the
                  next forecast capture.

          - choose:
              - conditions: "{{ window_open }}"
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: !input manual_override_timestamp_helper
                    data:
                      timestamp: 0

          - choose:
              - conditions: "{{ execute_now }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: !input manual_override_context_helper
                    data:
                      value: "{{ context.id }}"
                  - choose:
                      - conditions: "{{ should_be_off }}"
                        sequence:
                          - action: climate.set_hvac_mode
                            target:
                              entity_id: !input climate_entities
                            data:
                              hvac_mode: "off"
                      - conditions: "{{ not should_be_off and day_type == 'cool' }}"
                        sequence:
                          - action: climate.set_hvac_mode
                            target:
                              entity_id: !input climate_entities
                            data:
                              hvac_mode: cool
                          - action: climate.set_temperature
                            target:
                              entity_id: !input climate_entities
                            data:
                              temperature: "{{ target_temp }}"
                      - conditions: "{{ not should_be_off and day_type == 'heat' }}"
                        sequence:
                          - action: climate.set_hvac_mode
                            target:
                              entity_id: !input climate_entities
                            data:
                              hvac_mode: heat
                          - action: climate.set_temperature
                            target:
                              entity_id: !input climate_entities
                            data:
                              temperature: "{{ target_temp }}"
